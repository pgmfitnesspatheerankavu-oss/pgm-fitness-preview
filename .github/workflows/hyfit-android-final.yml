name: HYFIT Android APK (verified icon)
on:
  workflow_dispatch:
  push:
    branches:
      - hyfit-app
    paths:
      - '.github/workflows/hyfit-android-final.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'icons/**'
      - 'new-app.html'
      - 'new-app.css'
      - 'new-app.js'
      - 'manifest.webmanifest'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HYFIT source
        uses: actions/checkout@v4
        with:
          ref: hyfit-app
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web bundle and source artwork
        run: |
          npm install
          npm run build:web
          mkdir -p resources
          node -e "const sharp=require('sharp');Promise.all([sharp('icons/icon.svg').resize(1024,1024).png().toFile('resources/icon.png'),sharp('icons/icon.svg').resize(2732,2732).png().toFile('resources/splash.png')]).catch(e=>{console.error(e);process.exit(1)})"
      - name: Generate Android project and HYFIT native assets
        run: |
          npx cap add android
          npx cap sync android
          npx @capacitor/assets generate --android
          npx cap sync android
          test -d android/app/src/main/res
          find android/app/src/main/res -iname '*ic_launcher*' -o -iname '*splash*' | grep .
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK contents
        run: |
          python3 - <<'PY'
          import zipfile
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              html=z.read('assets/public/index.html').decode('utf-8','replace')
              manifest=z.read('assets/public/manifest.webmanifest').decode('utf-8','replace')
              assert 'HYFIT Gold Logo' in html, 'HYFIT logo missing from app page'
              assert './icons/hyfit-icon-512.png' in manifest, 'HYFIT PWA icon missing'
              assert 'assets/public/icons/hyfit-icon-512.png' in names, 'HYFIT web icon missing'
              assert 'resources.arsc' in names, 'Compiled Android resources missing'
              assert 'PGM Fitness' not in html, 'Old PGM page detected'
          print('APK bundle checks passed: HYFIT page, web icon and compiled Android resources are present.')
          PY
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: HYFIT-APK-ICON-FIX
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
