name: Build PGM Fitness Android APK

on:
  workflow_dispatch:
  push:
    branches: ["firebase-cloud-app-preview"]
    paths:
      - "new-app.html"
      - "new-app.js"
      - "new-app.css"
      - "firebase-config.js"
      - "balance-calculator.js"
      - "access-policy.js"
      - "firebase-client.js"
      - "supabase-storage.js"
      - "cloud-data.js"
      - "cloud-data-policy.js"
      - "auth-policy.js"
      - "staff-management-policy.js"
      - "icons/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build web bundle
        run: |
          npm install
          npm run build:web
      - name: Generate PGM launcher icon
        run: |
          mkdir -p resources
          node -e "require('sharp')('icons/icon.svg').resize(1024,1024).png().toFile('resources/icon.png')"
          npx @capacitor/assets generate --android
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PGM-Fitness-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
